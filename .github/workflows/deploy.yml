name: ZAP Atlas — analyze, build, deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/SHA) to analyze (all repos unless overridden)"
        required: false
        default: ""
      repo_refs:
        description: "JSON map of repo name -> ref, e.g. {\"zaproxy\":\"main\"}"
        required: false
        default: "{}"
  schedule:
    - cron: "0 2 * * 1"

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  analyze:
    name: Analyze sources & validate data
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.atlas.outputs.sha }}
      title: ${{ steps.atlas.outputs.title }}
    steps:
      - name: Checkout Atlas repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The commit of this repository (the generator, frontend and stories) that the run built, at the top of the run summary.
      - name: Record the Atlas commit
        id: atlas
        run: |
          sha="$(git rev-parse HEAD)"
          title="$(git log -1 --format=%s)"
          { echo "sha=$sha"; echo "title=$title"; } >> "$GITHUB_OUTPUT"
          {
            echo "### ZAP Atlas commit"
            echo
            echo "- Commit: [\`${sha:0:12}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$sha)"
            echo "- Title: $title"
            echo "- Trigger: $GITHUB_EVENT_NAME on $GITHUB_REF_NAME"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install generator dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tree-sitter tree-sitter-java pytest

      # A repository that has not moved since an earlier run is replayed from this cache: it is not cloned or parsed.
      # Entries are named by repository, commit and generator code, so a stale one is simply ignored.
      - name: Restore parsed repositories
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sources/.atlas-cache
          key: atlas-parsed-${{ github.run_id }}
          restore-keys: atlas-parsed-

      - name: Run generator (clones the upstream repositories with full history)
        run: python -m atlas analyze --sources ./sources --output ./data --ref "$REF" --repo-refs "$REPO_REFS"
        env:
          REF: ${{ inputs.ref }}
          REPO_REFS: ${{ inputs.repo_refs }}

      - name: Validate generated data
        run: python -m atlas validate ./data --contract

      - name: Run Python tests
        run: python -m pytest tests -q

      - name: Dataset report
        run: python -m atlas report ./data | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload data artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-data
          path: data/
          retention-days: 1

  build:
    name: Build frontend + bundle data
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Atlas repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download data artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: atlas-data
          path: data/

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          ATLAS_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Bundle data into dist
        run: |
          mkdir -p frontend/dist/data
          cp -r data/. frontend/dist/data/

      # The browser download is cached by lockfile; the system libraries are still installed each run.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Browser smoke test
        working-directory: frontend
        env:
          ATLAS_BASE_PATH: /${{ github.event.repository.name }}/
          CI: "true"
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist/

  deploy:
    name: Deploy to GitHub Pages (preserves last good on failure)
    needs: build
    if: success()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Deployment summary
        env:
          ATLAS_SHA: ${{ needs.analyze.outputs.sha }}
          ATLAS_TITLE: ${{ needs.analyze.outputs.title }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "### Deployed"
            echo
            echo "- Site: $PAGE_URL"
            echo "- ZAP Atlas commit: [\`${ATLAS_SHA:0:12}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$ATLAS_SHA)"
            echo "- Title: $ATLAS_TITLE"
          } >> "$GITHUB_STEP_SUMMARY"
