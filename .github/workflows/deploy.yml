name: ZAP Atlas — analyze, build, deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/SHA) to analyze (all repos unless overridden)"
        required: false
        default: ""
      repo_refs:
        description: "JSON map of repo name -> ref, e.g. {\"zaproxy\":\"main\"}"
        required: false
        default: "{}"
  schedule:
    - cron: "0 2 * * 1"

concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  analyze:
    name: Analyze sources & validate data
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sources_json: ${{ steps.sources.outputs.sources_json }}
    steps:
      - name: Checkout Atlas repo
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install generator dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tree-sitter tree-sitter-java pytest

      - name: Check out upstream sources (full history)
        id: sources
        run: |
          python .github/workflows/scripts/checkout_sources.py
        env:
          REF: ${{ inputs.ref }}
          REPO_REFS: ${{ inputs.repo_refs }}

      - name: Run generator
        run: python -m atlas analyze --sources ./sources --output ./data

      - name: Validate generated data
        run: python -m atlas validate ./data

      - name: Report dataset sizes
        run: ls -lh data/ && python -c "import json;m=json.load(open('data/manifest.json'));print(json.dumps(m.get('inventory',[]),indent=2))"

      - name: Upload data artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: atlas-data
          path: data/
          retention-days: 1

  build:
    name: Build frontend + bundle data
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Atlas repo
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download data artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: atlas-data
          path: data/

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          ATLAS_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Bundle data into dist
        run: |
          mkdir -p frontend/dist/data
          cp -r data/. frontend/dist/data/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: frontend/dist/

  deploy:
    name: Deploy to GitHub Pages (preserves last good on failure)
    needs: build
    if: success()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
