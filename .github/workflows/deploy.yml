name: ZAP Atlas — analyze, build, deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/SHA) to analyze (all repos unless overridden)"
        required: false
        default: ""
      repo_refs:
        description: "JSON map of repo name -> ref, e.g. {\"zaproxy\":\"main\"}"
        required: false
        default: "{}"
  schedule:
    - cron: "0 2 * * 1"

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  analyze:
    name: Analyze sources & validate data
    runs-on: ubuntu-latest
    outputs:
      sources_json: ${{ steps.sources.outputs.sources_json }}
    steps:
      - name: Checkout Atlas repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install generator dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tree-sitter tree-sitter-java pytest

      - name: Check out upstream sources (full history)
        id: sources
        run: |
          python .github/workflows/scripts/checkout_sources.py
        env:
          REF: ${{ inputs.ref }}
          REPO_REFS: ${{ inputs.repo_refs }}

      - name: Run generator
        run: python -m atlas analyze --sources ./sources --output ./data

      - name: Validate generated data
        run: python -m atlas validate ./data --contract

      - name: Run Python tests
        run: python -m pytest tests -q

      - name: Dataset report
        run: python -m atlas report ./data | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload data artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-data
          path: data/
          retention-days: 1

  build:
    name: Build frontend + bundle data
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Atlas repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download data artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: atlas-data
          path: data/

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          ATLAS_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Bundle data into dist
        run: |
          mkdir -p frontend/dist/data
          cp -r data/. frontend/dist/data/

      - name: Browser smoke test
        working-directory: frontend
        env:
          ATLAS_BASE_PATH: /${{ github.event.repository.name }}/
          CI: "true"
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist/

  deploy:
    name: Deploy to GitHub Pages (preserves last good on failure)
    needs: build
    if: success()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
